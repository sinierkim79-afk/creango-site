<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0F766E">
  <title>크린고 로그인 확인</title>
  <style>
    :root{color-scheme:light;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:#182421;background:#f7faf9}.page{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{width:min(420px,100%);padding:34px 28px;border:1px solid #dce8e4;border-radius:24px;background:#fff;box-shadow:0 18px 55px #0b282514;text-align:center}.mark{display:grid;place-items:center;width:54px;height:54px;margin:0 auto 16px;border-radius:17px;background:#0f766e;color:#fff;font-size:25px;font-weight:900}.brand{margin:0;color:#0f766e;font-size:12px;font-weight:900;letter-spacing:1.2px}.card h1{margin:9px 0 10px;font-size:23px;letter-spacing:-.5px}.card p{margin:0;color:#62716e;font-size:14px;line-height:1.6}.error{color:#b42318!important}.retry{display:inline-block;margin-top:18px;color:#0f766e;font-size:13px;font-weight:800;text-decoration:none}
  </style>
</head>
<body><main class="page"><section class="card" aria-live="polite"><div class="mark">C</div><p class="brand">CREANGO</p><h1 id="title">로그인을 확인하고 있어요</h1><p id="message">잠시 후 크린고 앱으로 돌아갑니다.</p><a id="home" class="retry" href="./" hidden>크린고 공식 페이지로 돌아가기</a></section></main>
<script>
  (() => {
    const title = document.getElementById('title'); const message = document.getElementById('message'); const home = document.getElementById('home');
    const params = new URLSearchParams(location.search); const code = params.get('code'); const state = params.get('state'); const suppliedProvider = params.get('provider'); const error = params.get('error');
    const apiOrigin = 'https://cleannect-rz6oywhk.manus.space';
    const encodeUser = (user) => btoa(unescape(encodeURIComponent(JSON.stringify(user))));
    const fail = (text) => { title.textContent = '로그인을 완료하지 못했어요'; message.textContent = text; message.className = 'error'; home.hidden = false; };
    if (error) return fail('로그인이 취소되었거나 제공자에서 인증을 완료하지 못했습니다. 앱에서 다시 시도해 주세요.');
    if (!code || !state) return fail('유효한 로그인 요청이 아닙니다. 이 주소는 직접 열지 말고 앱에서 로그인을 시작해 주세요.');
    try {
      const [payload] = state.split('.');
      const normalized = payload.replace(/-/g, '+').replace(/_/g, '/');
      const decoded = decodeURIComponent(Array.prototype.map.call(atob(normalized), (c) => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
      const data = JSON.parse(decoded);
      const destination = new URL(data.returnTo);
      if (destination.protocol !== 'manuscleannect:' || !data.provider || (suppliedProvider && data.provider !== suppliedProvider)) throw new Error('invalid-state');
      title.textContent = '로그인 정보를 안전하게 연결하고 있어요';
      message.textContent = '잠시 후 크린고 앱으로 돌아갑니다.';
      fetch(apiOrigin + '/api/social-auth/exchange', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ provider: data.provider, code, state }) })
        .then(async (response) => { const result = await response.json().catch(() => ({})); if (!response.ok || !result.app_session_id || !result.user) throw new Error(result.error || 'exchange-failed'); return result; })
        .then((result) => { destination.searchParams.set('sessionToken', result.app_session_id); destination.searchParams.set('user', encodeUser(result.user)); location.replace(destination.toString()); })
        .catch(() => fail('로그인 세션을 연결하지 못했습니다. 앱에서 다시 시도해 주세요.'));
    } catch { fail('로그인 정보를 안전하게 확인하지 못했습니다. 앱에서 다시 시도해 주세요.'); }
  })();
</script></body></html>
